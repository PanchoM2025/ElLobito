<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>El Lobito</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El Lobito">
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.title = '🐺 El Lobito';
    document.getElementById('main-title').textContent = '🐺 El Lobito';
    fetch(location.pathname + '?_nc=' + Date.now())
      .then(r => r.text())
      .then(html => {
        const m = html.match(/const VERSION\s*=\s*"([^"]+)"/);
        if (m && m[1] !== VERSION) { location.reload(true); return; }
        loadState();
      })
      .catch(() => { loadState(); });
  });
</script>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:Arial,sans-serif; background:#1a472a; color:#fff; min-height:100vh; }
#setup { max-width:420px; margin:0 auto; padding:40px 24px; }
#setup h1 { font-size:26px; color:#ffd700; text-align:center; margin-bottom:6px; letter-spacing:1px; }
.subtitle { color:#a8d8a8; text-align:center; font-size:13px; margin-bottom:28px; }
.player-row { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; }
.player-row label { color:#a8d8a8; font-size:14px; text-align:right; min-width:80px; }
.player-row input { width:6ch; background:#e8f5e9; color:#1a3a1a; border:none; border-radius:4px; padding:8px 6px; font-size:16px; text-align:center; }
#game { display:none; padding:10px 6px 90px; }
#game-title { font-size:15px; color:#ffd700; text-align:center; margin-bottom:10px; letter-spacing:.5px; }
.grid-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.grid { border-collapse:collapse; width:100%; }
table.grid th { background:#0d3318; color:#a8d8a8; padding:7px 2px; text-align:center; font-size:12px; white-space:nowrap; position:sticky; top:0; z-index:5; }
table.grid th.hdr-h { width:26px; }
table.grid th.hdr-p { width:52px; }
table.grid th.hdr-i { width:34px; }
table.grid td { padding:3px 2px; text-align:center; }
tr.r-even td { background:#245c38; }
tr.r-odd  td { background:#1a472a; }
tr.r-empate td { background:#1e1e42; }
tr.r-hot    td { background:#2e1e08; }
.hole-num { font-size:12px; color:#a8d8a8; font-weight:bold; }
.tog { width:44px; height:36px; border:2px solid #3d5a3d; border-radius:6px; background:#1a3a1a; color:#666; font-size:13px; font-weight:bold; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; transition:all .12s; }
.tog.on     { background:#2d8a2d; color:#fff;    border-color:#ffd700; }
.tog.lobito { background:#7a0000; color:#ffd700; border-color:#ff4444; }
td.ind { width:32px; min-width:32px; }
.badge-mult { display:inline-block; background:#e65c00; color:#fff; border-radius:8px; font-size:10px; font-weight:bold; padding:1px 5px; }
.badge-emp  { font-size:12px; color:#6699ff; }
.badge-lob  { font-size:13px; }
tr.totals-row td { background:#0d3318; color:#ffd700; font-weight:bold; font-size:13px; padding:7px 2px; border-top:2px solid #3d8a3d; }
.tv-pos { color:#90ee90 !important; }
.tv-neg { color:#ff7777 !important; }
.btn-bar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:6px; padding:10px 10px 12px; background:#0a2a14; border-top:1px solid #3d8a3d; z-index:20; }
.btn-bar button { flex:1; padding:11px 4px; border:none; border-radius:8px; font-size:13px; font-weight:bold; cursor:pointer; touch-action:manipulation; }
.btn-calc { background:#ffd700; color:#1a3a1a; }
.btn-h19  { background:#87ceeb; color:#1a3a1a; }
.btn-limpiar { background:#2d6a2d; color:#e8ffe8; }
.btn-nueva   { background:#1a3a1a; color:#a8d8a8; }
#results { display:none; padding:12px 6px 80px; }
#res-title { font-size:15px; color:#ffd700; text-align:center; margin-bottom:10px; }
table.res { border-collapse:collapse; width:100%; font-size:13px; }
table.res th { background:#0d3318; color:#a8d8a8; padding:6px 4px; text-align:center; }
table.res td { padding:4px 4px; text-align:center; }
tr.rr-even td { background:#245c38; }
tr.rr-odd  td { background:#1a472a; }
tr.rr-emp  td { background:#1e1e42; color:#6699ff; }
tr.rr-sub  td { background:#0a2a14; color:#ffd700; font-weight:bold; border-top:2px solid #3d8a3d; }
tr.rr-price td { background:#1a3a5c; color:#87ceeb; font-weight:bold; font-size:14px; border-top:2px solid #87ceeb; }
tr.rr-h19  td { background:#3a2800; color:#ffd700; font-weight:bold; border-top:2px solid #ffd700; }
.rv-pos { color:#90ee90; }
.rv-neg { color:#ff7777; }
.sec-sep { margin-top:20px; padding-top:14px; border-top:2px solid #3d8a3d; }
.sec-title { font-size:14px; color:#87ceeb; font-weight:bold; text-align:center; margin-bottom:8px; }
.btn-volver { display:block; width:100%; margin-top:14px; padding:13px; background:#2d6a2d; color:#fff; font-size:15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; touch-action:manipulation; }
.btn-nueva-res { display:block; width:100%; margin-top:8px; padding:11px; background:#1a3a1a; color:#a8d8a8; font-size:14px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; touch-action:manipulation; }
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:100; align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal-box { background:#1a472a; border:2px solid #3d8a3d; border-radius:12px; padding:24px 20px; width:290px; text-align:center; }
.modal-box h3 { color:#ffd700; margin-bottom:8px; font-size:17px; }
.modal-box p  { color:#a8d8a8; font-size:13px; margin-bottom:12px; }
.modal-box input { width:100%; background:#e8f5e9; color:#1a3a1a; border:none; border-radius:6px; padding:11px; font-size:22px; text-align:center; margin-bottom:14px; }
.modal-btns { display:flex; gap:8px; }
.modal-btns button { flex:1; padding:11px; border:none; border-radius:7px; font-size:14px; font-weight:bold; cursor:pointer; }
.m-ok     { background:#ffd700; color:#1a3a1a; }
.m-cancel { background:#2d6a2d; color:#fff; }
.btn-start { width:100%; padding:15px; background:#2d6a2d; color:#ffd700; font-size:18px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; letter-spacing:1px; touch-action:manipulation; margin-top:20px; }
</style>
</head>
<body>

<div id="setup">
  <h1 id="main-title">El Lobito</h1>
  <p class="subtitle">Golf &middot; 5 jugadores &middot; 18 hoyos</p>
  <div id="player-inputs">
    <div class="player-row"><label>Jugador 1:</label><input type="text" id="pn0" value="A" maxlength="4" autocorrect="off" autocapitalize="characters"></div>
    <div class="player-row"><label>Jugador 2:</label><input type="text" id="pn1" value="B" maxlength="4" autocorrect="off" autocapitalize="characters"></div>
    <div class="player-row"><label>Jugador 3:</label><input type="text" id="pn2" value="C" maxlength="4" autocorrect="off" autocapitalize="characters"></div>
    <div class="player-row"><label>Jugador 4:</label><input type="text" id="pn3" value="D" maxlength="4" autocorrect="off" autocapitalize="characters"></div>
    <div class="player-row"><label>Jugador 5:</label><input type="text" id="pn4" value="E" maxlength="4" autocorrect="off" autocapitalize="characters"></div>
  </div>
  <button class="btn-start" onclick="startGame()">COMENZAR &#9658;</button>
</div>

<div id="game">
  <p id="game-title">El Lobito</p>
  <div class="grid-wrap">
    <table class="grid" id="grid-tbl"></table>
  </div>
  <div class="btn-bar">
    <button class="btn-calc"    onclick="openModal('calc')">CALCULAR</button>
    <button class="btn-h19"     onclick="openModal('h19')">HOYO 19</button>
    <button class="btn-limpiar" onclick="limpiar()">LIMPIAR</button>
    <button class="btn-nueva"   onclick="newGame()">NUEVA</button>
  </div>
</div>

<div id="results">
  <p id="res-title">Resultados - El Lobito</p>
  <div class="grid-wrap">
    <table class="res" id="res-tbl"></table>
  </div>
  <div id="h19-section" style="display:none" class="sec-sep">
    <p class="sec-title">Hoyo 19</p>
    <div class="grid-wrap">
      <table class="res" id="h19-tbl"></table>
    </div>
  </div>
  <button class="btn-volver"    onclick="showGame()">Volver a la tarjeta</button>
  <button class="btn-nueva-res" onclick="newGame()">Nueva Partida</button>
</div>

<div class="modal-bg" id="modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <p  id="modal-desc"></p>
    <input type="number" id="modal-input" inputmode="decimal" min="0">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal()">Cancelar</button>
      <button class="m-ok"     onclick="confirmModal()">Aceptar</button>
    </div>
  </div>
</div>

<script>
const VERSION = "20260810-004";

const BASE_WIN  = [0, 12,  6,  4,  3];
const BASE_LOSE = [0, -3, -4, -6, -12];

let playerNames  = ['A','B','C','D','E'];
let sel          = Array.from({length:18}, () => [false,false,false,false,false]);
let precioUnidad = 0;
let modalMode    = '';

const LS_KEY = 'ellobito_state';

function saveState() {
  const screen = document.getElementById('results').style.display === 'block' ? 'results' :
                 document.getElementById('game').style.display    === 'block' ? 'game'    : 'setup';
  try { localStorage.setItem(LS_KEY, JSON.stringify({ playerNames, sel, precioUnidad, screen })); } catch(e) {}
}

function clearState() {
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s) return;
    playerNames  = s.playerNames  || playerNames;
    sel          = s.sel          || sel;
    precioUnidad = s.precioUnidad || 0;
    for (let i = 0; i < 5; i++) {
      const el = document.getElementById('pn'+i);
      if (el) el.value = playerNames[i];
    }
    if (s.screen === 'game') {
      buildGrid();
      document.getElementById('setup').style.display   = 'none';
      document.getElementById('game').style.display    = 'block';
      document.getElementById('results').style.display = 'none';
    } else if (s.screen === 'results' && precioUnidad > 0) {
      buildGrid();
      buildResults(precioUnidad);
    } else if (s.screen === 'results') {
      buildGrid();
      document.getElementById('setup').style.display   = 'none';
      document.getElementById('game').style.display    = 'block';
      document.getElementById('results').style.display = 'none';
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });
window.addEventListener('pagehide', saveState);

function startGame() {
  for (let i = 0; i < 5; i++) {
    const v = document.getElementById('pn'+i).value.trim().toUpperCase();
    playerNames[i] = v || 'J'+(i+1);
  }
  sel = Array.from({length:18}, () => [false,false,false,false,false]);
  precioUnidad = 0;
  buildGrid();
  document.getElementById('setup').style.display   = 'none';
  document.getElementById('game').style.display    = 'block';
  document.getElementById('results').style.display = 'none';
}

function buildGrid() {
  const tbl = document.getElementById('grid-tbl');
  tbl.innerHTML = '';
  const thead = document.createElement('thead');
  let thHtml = '<tr><th class="hdr-h">H</th>';
  playerNames.forEach(n => thHtml += '<th class="hdr-p">'+n+'</th>');
  thHtml += '<th class="hdr-i"></th></tr>';
  thead.innerHTML = thHtml;
  tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (let h = 0; h < 18; h++) {
    const tr = document.createElement('tr');
    tr.id = 'row'+h;
    tr.className = h%2===0 ? 'r-even' : 'r-odd';
    let html = '<td class="hole-num">'+(h+1)+'</td>';
    for (let p = 0; p < 5; p++) {
      html += '<td><button class="tog" id="tog_'+h+'_'+p+'" onclick="toggle('+h+','+p+')">'+playerNames[p]+'</button></td>';
    }
    html += '<td class="ind" id="ind_'+h+'"></td>';
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }
  const trTot = document.createElement('tr');
  trTot.className = 'totals-row';
  let totHtml = '<td>TOT</td>';
  for (let p = 0; p < 5; p++) totHtml += '<td id="tot_'+p+'">0</td>';
  totHtml += '<td></td>';
  trTot.innerHTML = totHtml;
  tbody.appendChild(trTot);
  tbl.appendChild(tbody);
  refreshGrid();
}

function toggle(h, p) { sel[h][p] = !sel[h][p]; refreshGrid(); }

function limpiar() {
  if (!confirm('Limpiar toda la tarjeta?')) return;
  sel = Array.from({length:18}, () => [false,false,false,false,false]);
  refreshGrid();
}

function refreshGrid() {
  let acum = 0;
  const totals = [0,0,0,0,0];
  for (let h = 0; h < 18; h++) {
    const numWin   = sel[h].filter(Boolean).length;
    const isEmpate = (numWin === 0 || numWin === 5);
    const isLobito = (numWin === 1);
    const mult     = acum + 1;
    const row      = document.getElementById('row'+h);
    if (isEmpate && numWin === 0)   row.className = 'r-empate';
    else if (!isEmpate && mult > 1) row.className = 'r-hot';
    else                            row.className = h%2===0 ? 'r-even' : 'r-odd';
    for (let p = 0; p < 5; p++) {
      const btn = document.getElementById('tog_'+h+'_'+p);
      btn.className = 'tog';
      if (sel[h][p]) btn.classList.add(isLobito ? 'lobito' : 'on');
    }
    const ind = document.getElementById('ind_'+h);
    if (isEmpate && numWin === 0)        ind.innerHTML = '<span class="badge-emp">=&gt;</span>';
    else if (isLobito && mult > 1)       ind.innerHTML = '<span class="badge-mult">x'+mult+'</span> W';
    else if (isLobito)                   ind.innerHTML = 'W';
    else if (mult > 1 && !isEmpate)      ind.innerHTML = '<span class="badge-mult">x'+mult+'</span>';
    else                                 ind.innerHTML = '';
    if (!isEmpate) {
      const wp = BASE_WIN[numWin]  * mult;
      const lp = BASE_LOSE[numWin] * mult;
      for (let p = 0; p < 5; p++) totals[p] += sel[h][p] ? wp : lp;
      acum = 0;
    } else { acum = Math.min(acum + 1, 17); }
  }
  for (let p = 0; p < 5; p++) {
    const el = document.getElementById('tot_'+p);
    const v  = totals[p];
    el.textContent = v > 0 ? '+'+v : String(v);
    el.className   = v > 0 ? 'tv-pos' : v < 0 ? 'tv-neg' : '';
  }
}

function calcAll() {
  let acum = 0;
  const totals = [0,0,0,0,0];
  const holeData = [];
  for (let h = 0; h < 18; h++) {
    const numWin   = sel[h].filter(Boolean).length;
    const isEmpate = (numWin === 0 || numWin === 5);
    const isLobito = (numWin === 1);
    const mult     = acum + 1;
    if (isEmpate) {
      holeData.push({ pts:[0,0,0,0,0], acum, mult, isEmpate:true, isLobito:false });
      acum = Math.min(acum + 1, 17);
    } else {
      const wp  = BASE_WIN[numWin]  * mult;
      const lp  = BASE_LOSE[numWin] * mult;
      const pts = sel[h].map(w => w ? wp : lp);
      holeData.push({ pts, acum, mult, isEmpate:false, isLobito });
      pts.forEach((v,i) => totals[i] += v);
      acum = 0;
    }
  }
  return { holeData, totals };
}

function buildResults(precio) {
  precioUnidad = precio;
  const { holeData, totals } = calcAll();
  const tbl = document.getElementById('res-tbl');
  tbl.innerHTML = '';
  let thHtml = '<thead><tr><th>H</th>';
  playerNames.forEach(n => thHtml += '<th>'+n+'</th>');
  thHtml += '</tr></thead>';
  tbl.innerHTML = thHtml;
  const tbody = document.createElement('tbody');
  holeData.forEach((d, h) => {
    const tr = document.createElement('tr');
    tr.className = d.isEmpate ? 'rr-emp' : h%2===0 ? 'rr-even' : 'rr-odd';
    let lbl = String(h+1);
    if (d.isLobito) lbl += ' W';
    if (d.mult > 1) lbl += '<br><small style="color:#e65c00">x'+d.mult+'</small>';
    if (d.isEmpate) lbl += '<br><small style="color:#6699ff">=&gt;</small>';
    let html = '<td>'+lbl+'</td>';
    d.pts.forEach(v => {
      const cls = v > 0 ? 'rv-pos' : v < 0 ? 'rv-neg' : '';
      const txt = v === 0 ? '-' : v > 0 ? '+'+v : String(v);
      html += '<td class="'+cls+'">'+txt+'</td>';
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  const trTot = document.createElement('tr');
  trTot.className = 'rr-sub';
  let totHtml = '<td>TOTAL</td>';
  totals.forEach(v => {
    const cls = v > 0 ? 'rv-pos' : v < 0 ? 'rv-neg' : '';
    totHtml += '<td class="'+cls+'">'+(v > 0 ? '+'+v : String(v))+'</td>';
  });
  trTot.innerHTML = totHtml;
  tbody.appendChild(trTot);
  const trPrice = document.createElement('tr');
  trPrice.className = 'rr-price';
  let priceHtml = '<td>$ (x'+precio.toLocaleString('es-AR')+')</td>';
  totals.forEach(v => {
    const money = Math.round(v * precio);
    const cls   = money > 0 ? 'rv-pos' : money < 0 ? 'rv-neg' : '';
    const txt   = money > 0 ? '+'+money.toLocaleString('es-AR') : money.toLocaleString('es-AR');
    priceHtml += '<td class="'+cls+'">'+txt+'</td>';
  });
  trPrice.innerHTML = priceHtml;
  tbody.appendChild(trPrice);
  tbl.appendChild(tbody);
  document.getElementById('h19-section').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('game').style.display    = 'none';
}

function buildH19(monto) {
  const { totals } = calcAll();
  const best     = Math.max(...totals);
  const diffs    = totals.map(t => Math.max(0, best - t));
  const sumDiffs = diffs.reduce((a,b) => a+b, 0);
  if (sumDiffs === 0) { alert('No hay diferencias entre jugadores para repartir.'); return; }
  const pagos = diffs.map(d => d > 0 ? Math.round(monto * d / sumDiffs) : 0);
  const tbl = document.getElementById('h19-tbl');
  let html = '<thead><tr><th>Concepto</th>';
  playerNames.forEach(n => html += '<th>'+n+'</th>');
  html += '</tr></thead><tbody>';
  html += '<tr class="rr-even"><td style="color:#a8d8a8;font-size:12px">Puntos</td>';
  totals.forEach(v => {
    const cls = v > 0 ? 'rv-pos' : v < 0 ? 'rv-neg' : '';
    html += '<td class="'+cls+'">'+(v > 0 ? '+'+v : v)+'</td>';
  });
  html += '</tr><tr class="rr-h19"><td>Paga</td>';
  pagos.forEach(p => { html += p === 0 ? '<td>1ro</td>' : '<td>$'+p.toLocaleString('es-AR')+'</td>'; });
  html += '</tr></tbody>';
  tbl.innerHTML = html;
  document.getElementById('h19-section').style.display = 'block';
  document.getElementById('results').style.display = 'block';
  document.getElementById('game').style.display    = 'none';
  setTimeout(() => document.getElementById('h19-section').scrollIntoView({behavior:'smooth'}), 100);
}

function openModal(mode) {
  modalMode = mode;
  const inp = document.getElementById('modal-input');
  if (mode === 'calc') {
    document.getElementById('modal-title').textContent = 'Precio por unidad';
    document.getElementById('modal-desc').textContent  = 'Cuanto vale cada unidad?';
    inp.placeholder = 'Ej: 1000';
    inp.value = precioUnidad > 0 ? precioUnidad : '';
  } else {
    document.getElementById('modal-title').textContent = 'Hoyo 19';
    document.getElementById('modal-desc').textContent  = 'Monto total a repartir (el 1ro no paga):';
    inp.placeholder = 'Ej: 5000';
    inp.value = '';
  }
  document.getElementById('modal').classList.add('open');
  setTimeout(() => inp.focus(), 120);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function confirmModal() {
  const val = parseFloat(document.getElementById('modal-input').value);
  if (isNaN(val) || val <= 0) { alert('Ingresa un valor valido mayor a 0.'); return; }
  closeModal();
  if (modalMode === 'calc') buildResults(val);
  else                      buildH19(val);
}

document.getElementById('modal-input').addEventListener('keydown', e => { if (e.key === 'Enter') confirmModal(); });

function showGame() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('game').style.display    = 'block';
}

function newGame() {
  clearState();
  playerNames = ['A','B','C','D','E'];
  for (let i = 0; i < 5; i++) {
    const el = document.getElementById('pn'+i);
    if (el) el.value = playerNames[i];
  }
  document.getElementById('game').style.display    = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('setup').style.display   = 'block';
  precioUnidad = 0;
}
</script>
</body>
</html>
