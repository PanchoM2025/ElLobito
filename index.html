<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.title = '🐺 El Lobito';
    document.getElementById('main-title').textContent = '🐺 El Lobito';
    fetch(location.pathname + '?_nc=' + Date.now())
      .then(r => r.text())
      .then(html => {
        const m = html.match(/const VERSION\s*=\s*"([^"]+)"/);
        if (m && m[1] !== VERSION) { location.reload(true); return; }
        loadState();
      })
      .catch(() => { loadState(); });
  });
</script>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:Arial,sans-serif; background:#1a472a; color:#fff; min-height:100vh; }

/* ── SETUP ── */

.field-row label { color:#a8d8a8; font-size:14px; white-space:nowrap; min-width:64px; }
select, input[type="text"], input[type="number"] {
  background:#e8f5e9; color:#1a3a1a; border:none; border-radius:4px;
  padding:7px 10px; font-size:16px; -webkit-appearance:none; appearance:none;

<body>

<!-- ── SETUP ── -->
<div id="setup">
  <h1 id="main-title">🐺 El Lobito</h1>
  <div class="field-row">
    <label for="csel">Cancha:</label>
    <select id="csel" onchange="populateHcpTable()"></select>
  </div>
  <table class="player-tbl">
    <thead><tr><th>Jugador</th><th>Iniciales</th><th>HCP</th></tr></thead>
    <tbody id="prows"></tbody>
  </table>
  <p class="hcp-verify-label">Verifique los Hcp de los Hoyos</p>
  <div class="hcp-verify-wrap">
    <table class="hcp-vtbl">
      <thead><tr><th>Hoyo</th><th>Hcp</th><th class="sep"></th><th>Hoyo</th><th>Hcp</th></tr></thead>
      <tbody id="hcp-rows"></tbody>
    </table>
  </div>
  <div class="btn-hcp-row">
    <button class="btn-save"  onclick="saveCourse()">&#x1F4BE; Guardar Hcp</button>
    <button class="btn-reset" onclick="resetCourse()">&#x21A9; Restablecer Hcp</button>
  </div>
  <div id="save-toast">&#x2705; Guardado</div>
  <button class="btn-start" onclick="startGame()">COMENZAR &nbsp;&#9658;</button>
</div>

<!-- ── GAME ── -->
<div id="game">
  <p id="game-title">🐺 El Lobito</p>
  <p class="grid-hint">Score + ✓ para marcar equipo en cada hoyo</p>
  <div class="grid-wrap">
    <table class="grid" id="grid-tbl"></table>
  </div>
  <div class="ctrl-wrap">
    <p class="ctrl-title">📊 Control Scores</p>
    <div class="grid-wrap">
      <table class="ctrl" id="ctrl-tbl"></table>
    </div>
  </div>
  <div class="btn-bar">
    <button class="btn-calc"    onclick="openModal('calc')">VALORIZAR</button>
    <button class="btn-h19"     onclick="openModal('h19')">HOYO 19 🍺</button>
    <button class="btn-limpiar" onclick="limpiar()">LIMPIAR</button>
    <button class="btn-nueva"   onclick="newGame()">&#x21A9; NUEVA</button>
  </div>
</div>

<!-- ── RESULTS ── -->
<div id="results">
  <p id="res-title">📊 Resultados — El Lobito</p>
  <div class="grid-wrap">
    <table class="res" id="res-tbl"></table>
  </div>
  <div id="h19-section" style="display:none" class="sec-sep">
    <p class="sec-title">🍺 Hoyo 19</p>
    <div class="grid-wrap"><table class="res" id="h19-tbl"></table></div>
  </div>
  <button class="btn-volver"    onclick="showGame()">&#9664; &nbsp;Volver a la tarjeta</button>
  <button class="btn-nueva-res" onclick="newGame()">&#x21A9; &nbsp;Nueva Partida</button>
</div>

<!-- ── MODAL ── -->
<div class="modal-bg" id="modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <p  id="modal-desc"></p>
    <input type="number" id="modal-input" inputmode="decimal" min="0">
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal()">Cancelar</button>
      <button class="m-ok"     onclick="confirmModal()">Aceptar</button>
    </div>
  </div>
</div>

<script>
const VERSION = "20260811-010";

const COURSES = {

    [4, 3],[3,15],[4,17],[4, 9],[4, 5],[5, 1],[4, 7],[3,13],[4,11],
    [4,14],[4, 6],[5,10],[4,12],[3, 2],[5, 8],[4, 4],[3,18],[4,16]
  ],

    [5, 3],[3,13],[4, 5],[4,11],[4,15],[4, 9],[5, 1],[3,17],[4, 7],

  ],
  "Highland": [
    [4,17],[3,13],[5,11],[4, 1],[5,15],[3, 9],[4, 7],[4, 3],[4, 5],
    [5,16],[4, 8],[3,14],[4,12],[5,18],[3, 2],[4, 6],[4,10],[4, 4]
  ],
  "Lagartos (Agua-Larga)": [
    [4, 9],[3,17],[3, 3],[4,13],[3,15],[4, 7],[5, 1],[4, 5],[5,11],
    [3,16],[5,12],[4, 8],[4, 2],[5,10],[3,18],[5, 6],[4,14],[4, 4]
  ],
  "Campo Chico": [
    [4, 1],[4,13],[5, 3],[3, 7],[5, 5],[4,17],[4,15],[3, 9],[4,11],
    [4, 4],[3,10],[4, 8],[4,14],[4,18],[3,16],[5, 2],[5,12],[4, 6]
  ],
  "Hurlingham": [
    [4, 5],[4, 7],[3,13],[4,11],[5, 1],[5, 9],[3,15],[4, 3],[3,17],
    [4,14],[5, 4],[3,18],[5, 2],[4, 6],[3,10],[4, 8],[5,16],[4,12]
  ],
  "Jockey (Colorada)": [
    [4, 5],[4,11],[3,17],[5, 9],[4,13],[4, 7],[4, 1],[3,15],[4, 3],
    [5, 4],[5,12],[3,18],[4, 2],[4, 6],[5,10],[4, 8],[3,16],[4,14]
  ],
  "CUBA Fatima": [
    [5, 5],[3,15],[4, 1],[5,11],[4, 9],[4, 7],[3,17],[4, 3],[4,13],
    [4,12],[5, 6],[4, 4],[4, 8],[3,16],[4, 2],[4,10],[3,18],[5,14]
  ],
  "Pinguinos": [
    [4, 7],[5, 3],[3,17],[4,11],[4, 5],[3,15],[4, 9],[5, 1],[4,13],
    [4,10],[5, 4],[3,18],[4,14],[3,16],[4, 8],[5, 2],[3,12],[5, 6]
  ],
  "Golfers Country Club": [
    [4, 5],[4, 3],[4,13],[5,17],[3,15],[4, 7],[3, 9],[4,11],[5, 1],
    [4, 6],[4, 4],[5,16],[3,10],[4, 2],[4,12],[4, 8],[3,14],[5,18]
  ],
  "Cumelen": [
    [4, 5],[3, 9],[4, 7],[3,17],[4, 3],[5, 1],[4,15],[4,11],[3,13],
    [4, 6],[3,10],[4, 8],[3,18],[4, 4],[5, 2],[4,16],[4,12],[3,14]
  ],
};

const BASE_WIN  = [0, 12,  6,  4,  3];
const BASE_LOSE = [0, -3, -4, -6, -12];

let playerNames  = ['','','','',''];
let playerHcps   = [0,0,0,0,0];
let course       = [];
let scores       = Array.from({length:18}, () => Array(5).fill(''));
let teams        = Array.from({length:18}, () => Array(5).fill(false));
let precioUnidad = 0;
let modalMode    = '';

const LS_KEY = 'ellobito2_state';

// ── HCP helpers ──────────────────────────────────────────────────────────────
function hcp85(hcp)             { return Math.round(hcp * 0.85); }
function strokesTeam(hcp, hcpH) { const h85=hcp85(hcp); return Math.floor(h85/18)+(h85%18>=hcpH?1:0); }
function strokesFull(hcp, hcpH) { return Math.floor(hcp/18)+(hcp%18>=hcpH?1:0); }  // HCP 100% (SUASA/Stbl/AAG)
function stblPts(g, par, hcp, hcpH)  { return Math.max(0, par+strokesFull(hcp,hcpH)+2-g); }
function aagScore(g, par, hcp, hcpH) { return Math.min(g, par+strokesFull(hcp,hcpH)+2); }
function strokeBg(stk) {
  if (stk >= 2) return '#42a5f5';
  if (stk === 1) return '#b3e5fc';
  return '#e8f5e9';
}

// ── Course / HCP table ───────────────────────────────────────────────────────
function populateHcpTable() {
  const name  = document.getElementById('csel').value;
  const data  = COURSES[name];
  const saved = JSON.parse(localStorage.getItem('lob_hcp_' + name) || 'null');
  const hcpVal = h => (saved && saved[h] != null) ? saved[h] : data[h][1];
  const tbody = document.getElementById('hcp-rows');
  tbody.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const h1 = i, h2 = i + 9;
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="hnum">${h1+1}</td>` +
      `<td><input class="hv" type="number" id="hv${h1}" value="${hcpVal(h1)}" min="1" max="18" inputmode="numeric"></td>` +
      `<td class="sep"></td>` +
      `<td class="hnum">${h2+1}</td>` +
      `<td><input class="hv" type="number" id="hv${h2}" value="${hcpVal(h2)}" min="1" max="18" inputmode="numeric"></td>`;
    tbody.appendChild(tr);
  }
}

function saveCourse() {
  const name = document.getElementById('csel').value;
  const hcps = [];
  for (let h = 0; h < 18; h++) {
    const el  = document.getElementById(`hv${h}`);
    const val = el ? parseInt(el.value) : COURSES[name][h][1];
    hcps.push((!isNaN(val) && val >= 1 && val <= 18) ? val : COURSES[name][h][1]);
  }
  localStorage.setItem('lob_hcp_' + name, JSON.stringify(hcps));
  const t = document.getElementById('save-toast');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function resetCourse() {
  const name = document.getElementById('csel').value;
  localStorage.removeItem('lob_hcp_' + name);
  populateHcpTable();
  const t = document.getElementById('save-toast');
  t.textContent = 'Restablecido';
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; t.textContent = '✅ Guardado'; }, 2000);
}

// ── Init ─────────────────────────────────────────────────────────────────────
(function() {
  const csel = document.getElementById('csel');
  Object.keys(COURSES).forEach(name => {
    const o = document.createElement('option');
    o.value = o.textContent = name;
    csel.appendChild(o);
  });
  const tbody = document.getElementById('prows');
  for (let i = 0; i < 5; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td>Jugador ${i+1}</td>` +
      `<td><input class="ini" type="text" id="pn${i}" maxlength="4" autocorrect="off" autocapitalize="characters"></td>` +
      `<td><input class="hcp-in" type="number" id="ph${i}" placeholder="0" min="0" max="54" inputmode="numeric"></td>`;
    tbody.appendChild(tr);
  }
  populateHcpTable();
  loadState();
})();

// ── Persistencia ─────────────────────────────────────────────────────────────
function saveState() {
  const screen = document.getElementById('results').style.display === 'block' ? 'results' :
                 document.getElementById('game').style.display    === 'block' ? 'game'    : 'setup';
  try { localStorage.setItem(LS_KEY, JSON.stringify({
    playerNames, playerHcps, course,
    courseName: document.getElementById('game-title').textContent,
    scores, teams, precioUnidad, screen
  })); } catch(e) {}
}

function clearState() { try { localStorage.removeItem(LS_KEY); } catch(e) {} }

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s) return;
    playerNames  = s.playerNames || playerNames;
    playerHcps   = s.playerHcps  || playerHcps;
    course       = s.course      || [];
    precioUnidad = s.precioUnidad || 0;
    scores = s.scores || Array.from({length:18}, () => Array(5).fill(''));
    teams  = s.teams  || Array.from({length:18}, () => Array(5).fill(false));
    for (let i = 0; i < 5; i++) {
      const en = document.getElementById('pn'+i);
      const eh = document.getElementById('ph'+i);
      if (en) en.value = playerNames[i];
      if (eh) eh.value = playerHcps[i] || '';
    }
    if (s.screen === 'game') {
      if (s.courseName) document.getElementById('game-title').textContent = s.courseName;
      buildGrid();
      document.getElementById('setup').style.display   = 'none';
      document.getElementById('game').style.display    = 'block';
      document.getElementById('results').style.display = 'none';
    } else if (s.screen === 'results' && precioUnidad > 0) {
      if (s.courseName) document.getElementById('game-title').textContent = s.courseName;
      buildGrid();
      buildResults(precioUnidad);
    } else if (s.screen === 'results') {
      if (s.courseName) document.getElementById('game-title').textContent = s.courseName;
      buildGrid();
      document.getElementById('setup').style.display   = 'none';
      document.getElementById('game').style.display    = 'block';
      document.getElementById('results').style.display = 'none';
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });
window.addEventListener('pagehide', saveState);

// ── Comenzar ─────────────────────────────────────────────────────────────────
function startGame() {
  for (let i = 0; i < 5; i++) {
    const v = document.getElementById('pn'+i).value.trim().toUpperCase();
    playerNames[i] = v || 'J'+(i+1);
    const h = document.getElementById('ph'+i).value.trim();
    playerHcps[i] = h === '' ? 0 : Math.max(0, Math.min(54, parseInt(h)||0));
  }
  const name = document.getElementById('csel').value;
  const base = COURSES[name];
  course = base.map(([par], h) => {
    const hv = parseInt(document.getElementById(`hv${h}`).value);
    return [par, isNaN(hv)||hv<1||hv>18 ? base[h][1] : hv];
  });
  scores = Array.from({length:18}, () => Array(5).fill(''));
  teams  = Array.from({length:18}, () => Array(5).fill(false));
  precioUnidad = 0;
  document.getElementById('game-title').textContent = '🐺 El Lobito — ' + name;
  buildGrid();
  document.getElementById('setup').style.display   = 'none';
  document.getElementById('game').style.display    = 'block';
  document.getElementById('results').style.display = 'none';
  saveState();
}

// ── Grid ─────────────────────────────────────────────────────────────────────
function buildGrid() {

  tbl.innerHTML = '';

  // Header
  const thead = document.createElement('thead');
  let thHtml = '<tr><th class="hdr-h">H</th><th class="hdr-par">Par</th><th class="hdr-hcp">Hcp</th>';
  playerNames.forEach((n, i) => {
    thHtml += `<th class="hdr-p">${n}<br><span style="color:#ffd700;font-size:9px">H${playerHcps[i]}</span></th>`;
  });
  thHtml += '<th class="hdr-i"></th></tr>';
  thead.innerHTML = thHtml;
  tbl.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  for (let h = 0; h < 18; h++) {
    const [par, hcpH] = course[h] || [4, h+1];
    const tr = document.createElement('tr');
    tr.id = 'row'+h;
    tr.className = h%2===0 ? 'r-even' : 'r-odd';

    let html = `<td class="hole-num">${h+1}</td><td class="par-cell">${par}</td><td class="hcp-cell">${hcpH}</td>`;
    for (let p = 0; p < 5; p++) {
      const stk = strokesTeam(playerHcps[p], hcpH);
      const bg  = strokeBg(stk);
      const on  = teams[h][p];
      html +=
        `<td class="pc"><div class="pc-in">` +
        `<input class="sci" type="text" inputmode="numeric" id="si_${h}_${p}"` +
        ` value="${scores[h][p]}" style="background:${bg}"` +
        ` onchange="onScore(${h},${p},this.value)">` +
        `<button class="chk ${on?'on':'off'}" id="cb_${h}_${p}"` +
        ` onclick="toggleTeam(${h},${p})">${on?'✓':''}</button>` +
        `</div></td>`;
    }
    html += `<td class="ind" id="ind_${h}"></td>`;
    tr.innerHTML = html;
    tbody.appendChild(tr);
  }

  // SUASA TOTAL row
  const trSuasa = document.createElement('tr');
  trSuasa.className = 'r-suasa';
  let suasaHtml = '<td colspan="2" style="text-align:left;padding-left:4px;white-space:nowrap">SUASA TOT</td><td></td>';
  for (let p = 0; p < 5; p++) suasaHtml += `<td id="suasa_${p}">—</td>`;
  suasaHtml += '<td></td>';
  trSuasa.innerHTML = suasaHtml;
  tbody.appendChild(trSuasa);

  // Stableford row
  const trStbl = document.createElement('tr');
  trStbl.className = 'r-stbl';
  let stblHtml = '<td colspan="2" style="text-align:left;padding-left:4px;white-space:nowrap">Stableford</td><td></td>';
  for (let p = 0; p < 5; p++) stblHtml += `<td id="stbl_${p}">—</td>`;
  stblHtml += '<td></td>';
  trStbl.innerHTML = stblHtml;
  tbody.appendChild(trStbl);

  // AAG row
  const trAag = document.createElement('tr');
  trAag.className = 'r-aag';
  let aagHtml = '<td colspan="2" style="text-align:left;padding-left:4px;white-space:nowrap">AAG</td><td></td>';
  for (let p = 0; p < 5; p++) aagHtml += `<td id="aag_${p}">—</td>`;
  aagHtml += '<td></td>';
  trAag.innerHTML = aagHtml;
  tbody.appendChild(trAag);

  tbl.appendChild(tbody);

  // Build Control Scores table
  buildCtrlTable();

  recalcAll();
}

// ── Score / team input handlers ───────────────────────────────────────────────
function onScore(h, p, val) {
  scores[h][p] = val.trim().toUpperCase();
  recalcAll();
  saveState();
}

function toggleTeam(h, p) {
  teams[h][p] = !teams[h][p];
  const btn = document.getElementById(`cb_${h}_${p}`);
  if (teams[h][p]) { btn.className = 'chk on';  btn.textContent = '✓'; }
  else             { btn.className = 'chk off'; btn.textContent = ''; }
  recalcAll();
  saveState();
}

// ── Hole result ───────────────────────────────────────────────────────────────
function calcHoleResult(h) {
  if (!course[h]) return null;
  const [, hcpH] = course[h];

  const teamA = [], teamB = [];
  for (let p = 0; p < 5; p++) (teams[h][p] ? teamA : teamB).push(p);
  if (teamA.length === 0 || teamB.length === 0) return null; // no split

  const nets = [];
  for (let p = 0; p < 5; p++) {
    const raw = (scores[h][p] || '').trim().toUpperCase();
    if (raw === '')  { nets.push(null);     continue; }
    if (raw === 'X') { nets.push(Infinity); continue; }
    const g = parseInt(raw);
    nets.push(isNaN(g)||g<=0 ? null : g - strokesTeam(playerHcps[p], hcpH));
  }

  // All players must have a score
  if ([...teamA, ...teamB].some(p => nets[p] === null)) return null;

  const bestA = Math.min(...teamA.map(p => nets[p]));
  const bestB = Math.min(...teamB.map(p => nets[p]));

  if (bestA === bestB) return { empate:true, nets };

  const aWins = bestA < bestB;
  return {
    empate: false,
    winners: aWins ? teamA : teamB,
    losers:  aWins ? teamB : teamA,
    numWin:  (aWins ? teamA : teamB).length,
    nets
  };
}

// ── Recalc all ────────────────────────────────────────────────────────────────
function recalcAll() {
  let acum = 0;
  const lobTotals  = [0,0,0,0,0];  // El Lobito running totals
  const suasaTots  = [0,0,0,0,0];  // Gross score sums
  const stblTots   = [0,0,0,0,0];  // Stableford pts
  const aagTots    = [0,0,0,0,0];  // AAG totals
  const suasaHoles = [0,0,0,0,0];  // count of holes with scores (for SUASA display)
  const lobRun     = Array.from({length:18}, ()=>Array(5).fill(null)); // running El Lobito per hole

  for (let h = 0; h < 18; h++) {
    const [par, hcpH] = course[h] || [4, h+1];

    // ── SUASA / Stableford / AAG per hole ──────────────────────────────
    for (let p = 0; p < 5; p++) {
      const raw = (scores[h][p] || '').trim().toUpperCase();
      if (raw === '') continue;
      const isX = (raw === 'X');
      const g   = isX ? null : parseInt(raw);
      if (!isX && (isNaN(g) || g <= 0)) continue;
      const np2 = par + strokesFull(playerHcps[p], hcpH) + 2;
      suasaTots[p]  += isX ? np2 : g;
      stblTots[p]   += isX ? 0   : stblPts(g, par, playerHcps[p], hcpH);
      aagTots[p]    += isX ? np2 : aagScore(g, par, playerHcps[p], hcpH);
      suasaHoles[p]++;
    }

    // ── El Lobito result for this hole ─────────────────────────────────
    const result = calcHoleResult(h);
    const row    = document.getElementById('row'+h);
    const ind    = document.getElementById(`ind_${h}`);

    if (!result) {
      if (row) row.className = h%2===0 ? 'r-even' : 'r-odd';
      if (ind) ind.innerHTML = '';
      // running: carry previous
      for (let p = 0; p < 5; p++) lobRun[h][p] = h > 0 ? lobRun[h-1][p] : null;
    } else if (result.empate) {
      if (row) row.className = 'r-empate';
      if (ind) ind.innerHTML = '<span class="badge-emp">&#8658;</span>';
      acum = Math.min(acum + 1, 17);
      for (let p = 0; p < 5; p++) lobRun[h][p] = h > 0 ? (lobRun[h-1][p] ?? 0) : 0;
    } else {
      const mult     = acum + 1;
      const isLobito = result.numWin === 1;
      if (row) {
        row.className = mult > 1 ? 'r-hot' : (h%2===0 ? 'r-even' : 'r-odd');
      }
      if (ind) {
        let indHtml = '';
        if (mult > 1)  indHtml += `<span class="badge-mult">×${mult}</span>`;
        if (isLobito)  indHtml += '<span class="badge-lob">🐺</span>';
        ind.innerHTML = indHtml;
      }
      const holePts = Array(5).fill(0);
      result.winners.forEach(p => { holePts[p] = BASE_WIN[result.numWin]  * mult; lobTotals[p] += holePts[p]; });
      result.losers .forEach(p => { holePts[p] = BASE_LOSE[result.numWin] * mult; lobTotals[p] += holePts[p]; });
      for (let p = 0; p < 5; p++) {
        const prev = h > 0 ? (lobRun[h-1][p] ?? 0) : 0;
        lobRun[h][p] = prev + holePts[p];
      }
      acum = 0;
    }
  }

  // ── Update Control Scores table ────────────────────────────────────────
  for (let h = 0; h < 18; h++) {
    for (let p = 0; p < 5; p++) {
      const el = document.getElementById(`ctrl_${h}_${p}`);
      if (!el) continue;
      const v = lobRun[h][p];
      if (v === null) { el.textContent='—'; el.className=''; }
      else { el.textContent = v>0?'+'+v:String(v); el.className = v>0?'cv-pos':v<0?'cv-neg':''; }
    }
  }
  for (let p = 0; p < 5; p++) {
    const el = document.getElementById(`ctrltot_${p}`);
    if (!el) continue;
    const v = lobTotals[p];
    el.textContent = v>0?'+'+v:String(v);
    el.className   = v>0?'cv-pos':v<0?'cv-neg':'';
  }

  // ── Update SUASA / Stbl / AAG rows ────────────────────────────────────
  for (let p = 0; p < 5; p++) {
    const es = document.getElementById(`suasa_${p}`);
    const et = document.getElementById(`stbl_${p}`);
    const ea = document.getElementById(`aag_${p}`);
    if (es) es.textContent = suasaHoles[p] > 0 ? suasaTots[p] : '—';
    if (et) et.textContent = suasaHoles[p] > 0 ? stblTots[p]  : '—';
    if (ea) ea.textContent = suasaHoles[p] > 0 ? aagTots[p]   : '—';
  }
}

function limpiar() {
  if (!confirm('¿Limpiar toda la tarjeta?')) return;
  scores = Array.from({length:18}, () => Array(5).fill(''));
  teams  = Array.from({length:18}, () => Array(5).fill(false));
  buildGrid();
}

// ── calcAll (for results) ─────────────────────────────────────────────────────
function calcAll() {
  let acum = 0;
  const totals  = [0,0,0,0,0];
  const holeData = [];

  for (let h = 0; h < 18; h++) {
    const result = calcHoleResult(h);
    const mult   = acum + 1;

    if (!result) {
      holeData.push({ skip:true });
    } else if (result.empate) {
      holeData.push({ empate:true, nets:result.nets, mult, pts:Array(5).fill(0) });
      acum = Math.min(acum + 1, 17);
    } else {
      const pts = Array(5).fill(0);
      result.winners.forEach(p => pts[p] = BASE_WIN[result.numWin]  * mult);
      result.losers .forEach(p => pts[p] = BASE_LOSE[result.numWin] * mult);
      holeData.push({ empate:false, result, pts, mult, nets:result.nets });
      pts.forEach((v, i) => totals[i] += v);
      acum = 0;
    }
  }
  return { holeData, totals };
}

// ── Results ───────────────────────────────────────────────────────────────────
function buildResults(precio) {
  precioUnidad = precio;
  const { holeData, totals } = calcAll();
  const tbl = document.getElementById('res-tbl');
  tbl.innerHTML = '';

  let thHtml = '<thead><tr><th>H</th>';
  playerNames.forEach(n => thHtml += `<th>${n}</th>`);
  thHtml += '</tr></thead>';
  tbl.innerHTML = thHtml;

  const tbody = document.createElement('tbody');
  let ri = 0;
  holeData.forEach((d, h) => {
    if (d.skip) return;
    const tr = document.createElement('tr');
    tr.className = d.empate ? 'rr-emp' : ri%2===0 ? 'rr-even' : 'rr-odd';
    ri++;

    let lbl = String(h+1);
    if (!d.empate && d.result.numWin === 1) lbl += ' 🐺';
    if (d.mult > 1) lbl += `<br><small style="color:#e65c00">×${d.mult}</small>`;
    if (d.empate)   lbl += `<br><small style="color:#6699ff">&#8658;</small>`;

    let html = `<td>${lbl}</td>`;
    d.pts.forEach(v => {
      const cls = v > 0 ? 'rv-pos' : v < 0 ? 'rv-neg' : '';
      const txt = v === 0 ? (d.empate ? '=' : '—') : v > 0 ? '+'+v : String(v);
      html += `<td class="${cls}">${txt}</td>`;
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });

  const trTot = document.createElement('tr');
  trTot.className = 'rr-sub';
  let totHtml = '<td>TOTAL</td>';
  totals.forEach(v => {
    const cls = v > 0 ? 'rv-pos' : v < 0 ? 'rv-neg' : '';
    totHtml += `<td class="${cls}">${v > 0 ? '+'+v : String(v)}</td>`;
  });
  trTot.innerHTML = totHtml;
  tbody.appendChild(trTot);

  const trPrice = document.createElement('tr');
  trPrice.className = 'rr-price';
  let priceHtml = `<td>$(×${precio.toLocaleString('es-AR')})</td>`;
  totals.forEach(v => {
    const money = Math.round(v * precio);
    const cls   = money > 0 ? 'rv-pos' : money < 0 ? 'rv-neg' : '';
    const txt   = money > 0 ? '+'+money.toLocaleString('es-AR') : money.toLocaleString('es-AR');
    priceHtml += `<td class="${cls}">${txt}</td>`;
  });
  trPrice.innerHTML = priceHtml;
  tbody.appendChild(trPrice);
  tbl.appendChild(tbody);

  document.getElementById('h19-section').style.display = 'none';
  document.getElementById('game').style.display    = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo(0, 0);
  saveState();
}

function buildH19(monto) {
  const { totals } = calcAll();
  const best     = Math.max(...totals);
  const diffs    = totals.map(t => Math.max(0, best - t));
  const sumDiffs = diffs.reduce((a,b)=>a+b, 0);
  if (sumDiffs === 0) { alert('No hay diferencias para repartir.'); return; }
  const pagos = diffs.map(d => d > 0 ? Math.round(monto * d / sumDiffs) : 0);
  const tbl = document.getElementById('h19-tbl');
  let html = '<thead><tr><th>Concepto</th>';
  playerNames.forEach(n => html += `<th>${n}</th>`);
  html += '</tr></thead><tbody>';
  html += '<tr class="rr-even"><td style="color:#a8d8a8;font-size:12px">Pts</td>';
  totals.forEach(v => {
    const cls = v>0?'rv-pos':v<0?'rv-neg':'';
    html += `<td class="${cls}">${v>0?'+'+v:v}</td>`;
  });
  html += '</tr><tr class="rr-h19"><td>Paga</td>';
  pagos.forEach(p => { html += p===0 ? '<td>🏆</td>' : `<td>$${p.toLocaleString('es-AR')}</td>`; });
  html += '</tr></tbody>';
  tbl.innerHTML = html;
  document.getElementById('game').style.display    = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('h19-section').style.display = 'block';
  window.scrollTo(0, 0);
  setTimeout(() => document.getElementById('h19-section').scrollIntoView({behavior:'smooth'}), 150);
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(mode) {
  modalMode = mode;
  const inp = document.getElementById('modal-input');
  if (mode === 'calc') {
    document.getElementById('modal-title').textContent = 'Precio por unidad';
    document.getElementById('modal-desc').textContent  = '¿Cuánto vale cada unidad?';
    inp.placeholder = 'Ej: 1000';
    inp.value = precioUnidad > 0 ? precioUnidad : '';
  } else {
    document.getElementById('modal-title').textContent = '🍺 Hoyo 19';
    document.getElementById('modal-desc').textContent  = 'Monto total (el 1° no paga):';
    inp.placeholder = 'Ej: 5000';
    inp.value = '';
  }
  document.getElementById('modal').classList.add('open');
  setTimeout(() => inp.focus(), 120);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function confirmModal() {
  const val = parseFloat(document.getElementById('modal-input').value);
  if (isNaN(val) || val <= 0) { alert('Ingresá un valor mayor a 0.'); return; }
  closeModal();
  if (modalMode === 'calc') buildResults(val);
  else                      buildH19(val);
}

document.getElementById('modal-input').addEventListener('keydown', e => { if (e.key==='Enter') confirmModal(); });

function showGame() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('game').style.display    = 'block';
}

function newGame() {
  clearState();
  playerNames = ['','','','',''];
  playerHcps  = [0,0,0,0,0];
  for (let i = 0; i < 5; i++) {
    const en = document.getElementById('pn'+i);
    const eh = document.getElementById('ph'+i);
    if (en) en.value = '';
    if (eh) eh.value = '';
  }
  document.getElementById('game').style.display    = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('setup').style.display   = 'block';
  precioUnidad = 0;
}
